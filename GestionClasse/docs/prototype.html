<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion de classe — prototype</title>
<style>
:root{--esp:#2A1B15;--acc:#D2693F;--accc:#F9DDD0;--bg:#F8F5F2;--c:#EFEAE5;--ink:#1F1612;--mut:#5A4D46;--ol:#B9ABA2;--err:#B3261E}
@media(prefers-color-scheme:dark){:root{--esp:#F3E5DC;--acc:#F09468;--accc:#5A2D1B;--bg:#151010;--c:#251C18;--ink:#F2E6DF;--mut:#D3C3B9;--ol:#6F5F56}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#6b6b6b;font-family:Roboto,system-ui,Arial,sans-serif;color:var(--ink);padding:16px}
.hint{position:fixed;top:8px;left:0;right:0;text-align:center;color:#ddd;font-size:12px;pointer-events:none}
#phone{width:min(390px,100%);height:min(780px,calc(100vh - 40px));background:var(--bg);border-radius:34px;overflow:hidden;position:relative;box-shadow:0 20px 60px #0006}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:in .3s cubic-bezier(.23,1,.32,1)}
@keyframes in{from{transform:translateX(8%);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .32s cubic-bezier(.23,1,.32,1) both}
.bar{display:flex;align-items:center;gap:6px;padding:14px 10px 6px}.bar h2{margin:0;font-size:20px;font-weight:800}.bar small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.ib{width:44px;height:44px;border:0;background:none;border-radius:50%;font-size:20px;color:var(--ink);cursor:pointer}.ib:active{background:var(--c)}
.body{flex:1;overflow:auto;padding:6px 18px 24px}
button{font:inherit;cursor:pointer;transition:transform .12s}button:active{transform:scale(.97)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:26px;background:var(--esp);color:var(--bg);font-size:15px;margin-top:10px}
.btn.t{background:var(--c);color:var(--ink)}.btn.d{background:none;color:var(--err)}
h1.big{font-weight:900;font-size:34px;line-height:1.05;margin:20px 0 8px}.sub{color:var(--mut);font-size:14px}
.ill{height:170px;background:var(--c);border-radius:26px;position:relative;margin:40px 0 0}.ill i{position:absolute;border-radius:14px}
.panel{background:var(--c);border-radius:36px 36px 0 0;padding:16px 18px 22px;margin-top:auto}.panel small{display:block;text-align:center;font-size:12px;color:var(--mut);margin-bottom:12px}
.two{display:flex;gap:12px}.rc{flex:1;border:0;text-align:left;border-radius:28px;padding:14px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}
.rc b{display:block;font-size:17px;font-weight:600}.dark{background:var(--esp);color:var(--bg)}.light{background:#fff;color:#1F1612}
.chip{width:42px;height:42px;border-radius:50%;background:#ffffff2e;display:flex;align-items:center;justify-content:center;font-size:18px}.light .chip{background:var(--accc)}
.seed{display:block;margin:12px auto 0;background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline}
.hd{display:flex;align-items:center;gap:12px;margin-top:10px}.av{width:52px;height:52px;border-radius:50%;background:var(--esp);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;flex:none}
.hd b{font-weight:900;font-size:20px;display:block}.hd span{font-size:13px;color:var(--mut)}
.hero{background:var(--c);border-radius:32px;padding:22px;margin-top:20px}.hero small{font-size:13px;color:var(--mut)}.hero h3{margin:2px 0 12px;font-weight:900;font-size:24px}
.cnt{display:flex;align-items:flex-end;gap:10px}.cnt strong{font-size:44px;color:var(--acc);font-weight:900;line-height:1}.cnt span{flex:1;font-size:13px;color:var(--mut);padding-bottom:8px}.cnt .ic2{width:56px;height:56px;border-radius:50%;background:var(--accc);display:flex;align-items:center;justify-content:center;font-size:22px}
.hero p{font-size:13px;color:var(--mut);margin:12px 0 0}
.empty{background:var(--c);border-radius:24px;padding:20px;margin-top:20px;font-size:15px}
.sec{font-weight:900;font-size:18px;margin:26px 0 6px}.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{border:0;text-align:left;border-radius:28px;padding:16px;min-height:156px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;background:var(--c);color:var(--ink)}.gc b{display:block;font-size:17px;font-weight:600}
.gc .chip{background:#fff;color:#1F1612}.gc.dark .chip{background:#ffffff2e;color:var(--bg)}.gc.dark{background:var(--esp);color:var(--bg)}
.nav{height:84px;background:#fff;color:#1F1612;border-radius:32px 32px 0 0;display:flex;align-items:center;justify-content:space-around;font-size:11px;box-shadow:0 -4px 16px #0002;flex:none}
@media(prefers-color-scheme:dark){.nav{background:#100B0A;color:#F2E6DF}}
.nav button{border:0;background:none;color:inherit;font-size:11px;padding:8px 14px}.nav .fab{width:60px;height:60px;border-radius:50%;background:var(--esp);color:var(--bg);font-size:30px;padding:0}
.field{margin-top:14px}.field label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 6px}.field input,.field textarea{width:100%;border:1.5px solid var(--ol);border-radius:20px;padding:14px 16px;font:inherit;font-size:15px;background:transparent;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--esp)}.field.err input,.field.err textarea{border-color:var(--err)}.field .e{color:var(--err);font-size:12px;margin:4px 0 0 8px;display:none}.field.err .e{display:block}
.row{display:flex;align-items:center;gap:14px;background:var(--c);border-radius:24px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;border:0;text-align:left;color:var(--ink)}
.row .a{width:48px;height:48px;border-radius:50%;background:var(--accc);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}.row b{display:block;font-weight:600;font-size:16px}.row span{font-size:13px;color:var(--mut)}
.search{width:100%;border:1.5px solid var(--ol);border-radius:20px;padding:13px 16px;font:inherit;background:transparent;color:var(--ink);margin-bottom:10px;outline:none}
.cap{font-size:12px;font-weight:600;margin:4px 0 8px}.msg-empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:15px}
.card{background:var(--c);border-radius:26px;padding:18px;margin-top:20px}.card small{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:12px}.card small:first-child{margin-top:0}.card div{font-size:16px}
.chat{flex:1;overflow:auto;padding:8px 14px;display:flex;flex-direction:column}
.b{max-width:78%;padding:10px 14px;border-radius:22px;font-size:15px;margin:4px 0;animation:rise .25s cubic-bezier(.23,1,.32,1) both;word-wrap:break-word}.b.s{background:var(--esp);color:var(--bg);align-self:flex-end;border-bottom-right-radius:6px}.b.r{background:#ECE5DF;color:#1F1612;align-self:flex-start;border-bottom-left-radius:6px}
@media(prefers-color-scheme:dark){.b.r{background:#3A2E28;color:#F2E6DF}}
.b em{display:block;text-align:right;font-size:10px;font-style:normal;opacity:.75;margin-top:3px}.att{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:13px;border:0;background:none;color:inherit;padding:6px 0;text-decoration:underline}
.pend{display:none;align-items:center;gap:8px;background:var(--c);padding:6px 14px;font-size:13px}.pend.on{display:flex}.pend span{flex:1}
.in{display:flex;gap:8px;align-items:flex-end;padding:8px 10px 14px}.in textarea{flex:1;border:1.5px solid var(--ol);border-radius:22px;padding:13px 16px;font:inherit;background:transparent;color:var(--ink);resize:none;height:50px;outline:none}.in .send{width:52px;height:52px;border-radius:50%;border:0;background:var(--esp);color:var(--bg);font-size:20px}
.ov{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}@keyframes fade{from{opacity:0}}
.dlg{background:var(--bg);width:100%;border-radius:32px 32px 0 0;padding:22px;animation:rise .3s cubic-bezier(.23,1,.32,1)}.dlg h3{margin:0 0 6px;font-size:20px}.dlg p{margin:0 0 8px;color:var(--mut);font-size:14px}
#toast{position:absolute;left:14px;right:14px;top:-120px;background:var(--bg);color:var(--ink);border-radius:20px;padding:12px 16px;box-shadow:0 8px 30px #0005;z-index:30;transition:top .35s cubic-bezier(.23,1,.32,1);cursor:pointer}#toast.on{top:12px}#toast b{display:block;font-size:14px}#toast span{font-size:13px;color:var(--mut)}
#snack{position:absolute;left:16px;right:16px;bottom:16px;background:var(--esp);color:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;z-index:30;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}#snack.on{opacity:1;transform:none}
</style></head><body>
<div class="hint">Prototype interactif — les données restent dans ce navigateur (localStorage)</div>
<div id="phone"><div id="toast"></div><div id="snack"></div></div>
<script>
const $=s=>document.querySelector(s), phone=$('#phone');
let S; try{S=JSON.parse(localStorage.getItem('gc')||'null')}catch(e){}
S=S||{classe:null,students:[],messages:[],role:null,me:null,seq:1};
const save=()=>{try{localStorage.setItem('gc',JSON.stringify(S))}catch(e){}};
let stack=[], pending=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stu=id=>S.students.find(s=>s.id===id), full=s=>s?`${s.prenom} ${s.nom}`:'', ini=s=>(s.prenom[0]+s.nom[0]).toUpperCase();
const teacher=()=>S.role==='T';
function snack(t){const e=$('#snack');e.textContent=t;e.classList.add('on');clearTimeout(snack.t);snack.t=setTimeout(()=>e.classList.remove('on'),2600)}
function go(name,p={}){stack.push({name,p});render()}
function back(){stack.pop();if(!stack.length)stack=[{name:'role',p:{}}];render()}
function reset(name,p={}){stack=[{name,p}];render()}
function render(){const {name,p}=stack[stack.length-1];phone.querySelectorAll('.screen,.ov').forEach(e=>e.remove());const d=document.createElement('div');d.className='screen';d.innerHTML=V[name](p);phone.appendChild(d);(A[name]||(()=>{}))(d,p);d.querySelectorAll('[data-stag]').forEach((e,i)=>{e.classList.add('rise');e.style.animationDelay=i*55+'ms'})}
const bar=(t,sub)=>`<div class="bar"><button class="ib" data-back aria-label="Retour">←</button><h2>${t}${sub?`<small>${sub}</small>`:''}</h2></div>`;
const V={
role:()=>`<div class="body" style="display:flex;flex-direction:column;padding-bottom:0"><div class="ill" data-stag><i style="left:26px;top:22px;width:130px;height:86px;background:var(--esp)"></i><i style="left:40px;top:38px;width:70px;height:9px;background:var(--acc);border-radius:4px"></i><i style="right:24px;top:22px;width:44px;height:104px;background:var(--accc)"></i><i style="left:26px;bottom:22px;width:38px;height:38px;background:var(--acc);border-radius:50%"></i><i style="left:76px;bottom:22px;width:38px;height:38px;background:#8C5A3C;border-radius:50%"></i><i style="left:126px;bottom:22px;width:38px;height:38px;background:var(--esp);border-radius:50%"></i></div><h1 class="big" data-stag>Gérez votre classe, simplement.</h1><div class="sub" data-stag>Choisissez votre mode pour continuer</div></div>
<div class="panel" data-stag><small>Choisissez votre mode</small><div class="two"><button class="rc dark" id="bt"><div class="chip">🎓</div><div><b>Enseignant</b>Créer et gérer</div></button><button class="rc light" id="bs"><div class="chip">👥</div><div><b>Étudiant</b>Consulter et échanger</div></button></div><button class="seed" id="seed">Charger des données d'exemple</button><button class="seed" id="wipe" style="margin-top:4px">Tout réinitialiser</button></div>`,
pick:()=>`${bar('Qui êtes-vous ?')}<div class="body" id="list"></div>`,
home:()=>{const c=S.classe,n=S.students.length,me=teacher()?null:stu(S.me),d=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
return `<div class="body" style="padding-bottom:100px"><div class="hd" data-stag><div class="av">${teacher()?'E':ini(me)}</div><div style="flex:1"><b>${teacher()?'Bonjour, enseignant':'Bonjour, '+esc(me.prenom)}</b><span>${d[0].toUpperCase()+d.slice(1)}</span></div><button class="ib" id="mode" aria-label="Changer de mode">⚙</button></div>
${c?`<div class="hero" data-stag><small>${esc(c.annee)}</small><h3>${esc(c.intitule)}</h3><div class="cnt"><strong>${n}</strong><span>${n>1?'étudiants inscrits':'étudiant inscrit'}</span><div class="ic2">🎓</div></div><p>${esc(c.description)}</p></div>`:`<div class="empty" data-stag>${teacher()?'Aucune classe n\'est enregistrée. Créez-la pour commencer.':'L\'enseignant n\'a pas encore créé la classe.'}</div>`}
<div class="sec" data-stag>Accès rapide</div><div class="gr"><button class="gc dark" id="gs" data-stag><div class="chip">👥</div><div><b>Étudiants</b>${n} étudiant${n>1?'s':''}</div></button>${teacher()?'':`<button class="gc" id="gm" data-stag><div class="chip">💬</div><div><b>Messages</b>Conversations</div></button>`}${(teacher()||c)?`<button class="gc" id="gc" data-stag><div class="chip">🏫</div><div><b>Classe</b>${teacher()?(c?'Modifier':'Créer'):'Consulter'}</div></button>`:''}</div></div>
<div class="nav" style="position:absolute;left:0;right:0;bottom:0"><button>🏠<br>Accueil</button><button class="fab" id="fab" aria-label="Ajouter">+</button><button id="ns">👥<br>Étudiants</button></div>`},
classe:()=>{const c=S.classe||{};return `${bar('Classe')}<div class="body">${['intitule|Intitulé','description|Description','annee|Année universitaire'].map(x=>{const[k,l]=x.split('|');return `<div class="field" data-k="${k}"><label>${l}</label>${k==='description'?`<textarea rows="3" ${teacher()?'':'disabled'}>${esc(c[k]||'')}</textarea>`:`<input ${teacher()?'':'disabled'} value="${esc(c[k]||'')}">`}<div class="e">Ce champ est obligatoire</div></div>`}).join('')}${teacher()?'<button class="btn" id="save" style="margin-top:24px">Enregistrer</button>':''}</div>`},
students:p=>`${bar(p.mode==='rcpt'?'Choisir un destinataire':'Étudiants de la classe')}<div class="body"><input class="search" id="q" placeholder="Rechercher un étudiant"><div class="cap" id="cnt"></div><div id="list"></div></div>${teacher()&&p.mode!=='rcpt'?'<button class="ib" id="add" style="position:absolute;right:18px;bottom:18px;width:60px;height:60px;background:var(--esp);color:var(--bg);font-size:30px;box-shadow:0 6px 20px #0004">+</button>':''}`,
form:p=>{const s=p.id?stu(p.id):{nom:'',prenom:'',email:'',tel:''};return `${bar(p.id?'Modifier l\'étudiant':'Nouvel étudiant')}<div class="body">${[['nom','Nom','Ce champ est obligatoire'],['prenom','Prénom','Ce champ est obligatoire'],['email','Adresse électronique','Adresse électronique invalide'],['tel','Numéro de téléphone','Numéro de téléphone invalide']].map(([k,l,e])=>`<div class="field" data-k="${k}"><label>${l}</label><input value="${esc(s[k])}" ${k==='tel'?'type="tel"':''}><div class="e">${e}</div></div>`).join('')}<button class="btn" id="save" style="margin-top:24px">Enregistrer</button></div>`},
detail:p=>{const s=stu(p.id);return `${bar('Fiche étudiant')}<div class="body"><div style="font-weight:900;font-size:28px;margin-top:6px" data-stag>${esc(full(s))}</div><div class="card" data-stag><small>Adresse électronique</small><div>${esc(s.email)}</div><small>Numéro de téléphone</small><div>${esc(s.tel)}</div></div><a class="btn" data-stag href="tel:${encodeURIComponent(s.tel)}" style="text-decoration:none">📞 Appeler</a>${!teacher()&&S.me!==s.id?'<button class="btn t" id="msg" data-stag>Envoyer un message</button>':''}${teacher()?'<button class="btn t" id="edit" data-stag>Modifier</button><button class="btn d" id="del" data-stag>Supprimer</button>':''}</div>`},
chat:p=>`${bar(esc(full(stu(p.peer))),'En tant que '+esc(full(stu(p.me))))}<div class="chat" id="chat"></div><div class="pend" id="pend"><span id="pn"></span><button class="ib" id="rm" style="width:36px;height:36px">✕</button></div><div class="in"><button class="ib" id="att" aria-label="Joindre un fichier">📎</button><textarea id="txt" placeholder="Votre message"></textarea><button class="send" id="snd" aria-label="Envoyer">➤</button></div>`
};
function rows(list,onpick,el){el.innerHTML=list.map((s,i)=>`<button class="row rise" style="animation-delay:${Math.min(i,7)*45}ms" data-id="${s.id}"><div class="a">${ini(s)}</div><div><b>${esc(full(s))}</b><span>${esc(s.tel)}</span></div></button>`).join('');el.querySelectorAll('.row').forEach(r=>r.onclick=()=>onpick(+r.dataset.id))}
const A={
role:d=>{$('#bt').onclick=()=>{S.role='T';S.me=null;save();reset('home')};$('#bs').onclick=()=>go('pick');
$('#seed').onclick=()=>{S.classe={intitule:'Licence 3 SIL',description:'Développement mobile, génie logiciel et bases de données.',annee:'2025-2026'};S.students=[['Mbarga','Aïcha','aicha@univ.cm','+237 690 12 34 56'],['Ngono','Paul','paul@univ.cm','+237 677 98 76 54'],['Kamga','Sandra','sandra@univ.cm','+237 655 11 22 33'],['Tchoua','Jean','jean@univ.cm','+237 699 44 55 66']].map(([nom,prenom,email,tel],i)=>({id:i+1,nom,prenom,email,tel}));S.messages=[];S.seq=10;save();snack('Données d\'exemple chargées')};
$('#wipe').onclick=()=>{S={classe:null,students:[],messages:[],role:null,me:null,seq:1};save();snack('Données effacées')}},
pick:d=>{const l=$('#list');if(!S.students.length){l.innerHTML='<div class="msg-empty">Aucun étudiant n\'est enregistré. L\'enseignant doit d\'abord ajouter les étudiants de la classe.</div>'}else rows(S.students,id=>{S.role='S';S.me=id;save();reset('home')},l)},
home:d=>{$('#mode').onclick=()=>{S.role=null;S.me=null;save();reset('role')};$('#gs').onclick=$('#ns').onclick=()=>go('students',{mode:'browse'});const gc=$('#gc');if(gc)gc.onclick=()=>go('classe');const gm=$('#gm');if(gm)gm.onclick=()=>go('students',{mode:'rcpt'});$('#fab').onclick=()=>teacher()?go('form',{}):go('students',{mode:'rcpt'})},
classe:d=>{const sv=$('#save');if(!sv)return;sv.onclick=()=>{const v={};let ok=true;d.querySelectorAll('.field').forEach(f=>{const x=f.querySelector('input,textarea').value.trim();v[f.dataset.k]=x;f.classList.toggle('err',!x);if(!x)ok=false});if(!ok)return;S.classe=v;save();snack('Classe enregistrée');back()}},
students:(d,p)=>{const q=$('#q'),l=$('#list');const draw=()=>{let L=S.students.filter(s=>(p.mode!=='rcpt'||s.id!==S.me)&&full(s).toLowerCase().includes(q.value.trim().toLowerCase())).sort((a,b)=>a.nom.localeCompare(b.nom));$('#cnt').textContent=`${L.length} étudiant${L.length>1?'s':''}`;if(!L.length){l.innerHTML=`<div class="msg-empty">${q.value?'Aucun étudiant ne correspond à cette recherche.':teacher()?'Aucun étudiant dans la classe. Appuyez sur + pour en ajouter un.':'Aucun étudiant n\'est enregistré.'}</div>`;return}rows(L,id=>p.mode==='rcpt'?go('chat',{me:S.me,peer:id}):go('detail',{id}),l)};q.oninput=draw;draw();const a=$('#add');if(a)a.onclick=()=>go('form',{})},
form:(d,p)=>{$('#save').onclick=()=>{const v={};d.querySelectorAll('.field').forEach(f=>v[f.dataset.k]=f.querySelector('input').value.trim());const bad={nom:!v.nom,prenom:!v.prenom,email:!/^[\w.%+-]+@[\w-]+(\.[\w-]+)*\.[A-Za-z]{2,}$/.test(v.email),tel:!(/^\+?[\d .()-]+$/.test(v.tel)&&v.tel.replace(/\D/g,'').length>=6)};d.querySelectorAll('.field').forEach(f=>f.classList.toggle('err',bad[f.dataset.k]));if(Object.values(bad).some(Boolean))return;if(p.id)Object.assign(stu(p.id),v);else S.students.push({id:S.seq++,...v});save();snack('Étudiant enregistré');back()}},
detail:(d,p)=>{const m=$('#msg');if(m)m.onclick=()=>go('chat',{me:S.me,peer:p.id});const e=$('#edit');if(e)e.onclick=()=>go('form',{id:p.id});const x=$('#del');if(x)x.onclick=()=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg"><h3>Supprimer l'étudiant ?</h3><p>${esc(full(stu(p.id)))} sera supprimé de la classe, ainsi que ses messages. Cette action est définitive.</p><button class="btn d" id="y">Supprimer</button><button class="btn t" id="n">Annuler</button></div>`;phone.appendChild(o);o.querySelector('#n').onclick=()=>o.remove();o.querySelector('#y').onclick=()=>{S.students=S.students.filter(s=>s.id!==p.id);S.messages=S.messages.filter(m=>m.from!==p.id&&m.to!==p.id);save();o.remove();snack('Étudiant supprimé');back()}}},
chat:(d,p)=>{const ch=$('#chat');pending=null;const draw=()=>{const L=S.messages.filter(m=>(m.from===p.me&&m.to===p.peer)||(m.from===p.peer&&m.to===p.me));ch.innerHTML=L.length?L.map(m=>`<div class="b ${m.from===p.me?'s':'r'}">${m.text?esc(m.text):''}${m.att?`<button class="att" data-att="${m.id}">${{PHOTO:'🖼',VIDEO:'🎬',DOC:'📄'}[m.att.t]} ${esc(m.att.n)}</button>`:''}<em>${new Date(m.at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</em></div>`).join(''):'<div class="msg-empty" style="margin:auto">Aucun message pour le moment. Écrivez le premier !</div>';ch.scrollTop=ch.scrollHeight;ch.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>snack('Sur Android, la pièce jointe s\'ouvre avec l\'application compatible.'))};draw();
$('#att').onclick=()=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg"><h3>Joindre…</h3><button class="btn t" data-t="PHOTO|photo_cours.jpg">🖼 Photo</button><button class="btn t" data-t="VIDEO|demo.mp4">🎬 Vidéo</button><button class="btn t" data-t="DOC|cours_room.pdf">📄 Document</button></div>`;phone.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};o.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const[t,n]=b.dataset.t.split('|');pending={t,n};$('#pn').textContent=n;$('#pend').classList.add('on');o.remove()})};
$('#rm').onclick=()=>{pending=null;$('#pend').classList.remove('on')};
$('#snd').onclick=()=>{const tx=$('#txt').value.trim();if(!tx&&!pending){snack('Écrivez un message ou joignez un fichier');return}const m={id:S.seq++,from:p.me,to:p.peer,text:tx,at:Date.now(),att:pending};S.messages.push(m);save();$('#txt').value='';pending=null;$('#pend').classList.remove('on');draw();notify(m)}}
};
function notify(m){const t=$('#toast');t.innerHTML=`<b>Nouveau message de ${esc(full(stu(m.from)))}</b><span>${esc((m.text||'📎').slice(0,80))}${m.att&&m.text?' 📎':''}</span>`;t.classList.add('on');t.onclick=()=>{t.classList.remove('on');S.me=m.to;S.role='S';save();stack=[{name:'home',p:{}},{name:'chat',p:{me:m.to,peer:m.from}}];render()};clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.remove('on'),4500)}
phone.addEventListener('click',e=>{if(e.target.closest('[data-back]'))back()});
reset(S.role?'home':'role');
</script></body></html>
